<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="128" height="128" rx="28" fill="url(#emerald)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.85" />

  <!-- Crescent Moon and Star -->
  <g transform="translate(64, 25)" filter="url(#glow)">
    <!-- Star -->
    <polygon points="0,-4 1.2,-0.5 4.5,-0.5 2,1.5 3,4.5 0,2.5 -3,4.5 -2,1.5 -4.5,-0.5 -1.2,-0.5" fill="url(#gold)" />
    <!-- Crescent -->
    <path d="M 0,-10 A 10 10 0 1 0 10 0 A 7.5 7.5 0 1 1 0,-10 Z" fill="url(#gold)" transform="translate(0, 3)" />
  </g>

  <!-- Islamic Dome Arch & Monogram R -->
  <g transform="translate(64, 76)" filter="url(#glow)">
    <!-- Dome Outline -->
    <path d="M 0,-34 C -12,-34 -32,-16 -32,16 C -32,28 -16,34 0,38 C 16,34 32,28 32,16 C 32,-16 12,-34 0,-34 Z" 
          fill="none" stroke="url(#gold)" stroke-width="3.5" opacity="0.9" />

    <!-- Letter R -->
    <text x="0" y="20" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="900" fill="url(#gold)" text-anchor="middle">
      R
    </text>
  </g>
</svg>